name: Build blog from Soro

on:
  schedule:
    - cron: "17 6 * * *"   # her gün 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-blog
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow certifi nh3
      - run: python tools/build-blog.py
      - name: Commit if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "blog: sync articles from Soro"
            git pull --rebase origin main
            git push
            echo "changed=1" >> "$GITHUB_OUTPUT"
          fi
      # Yeni/degisen icerik varsa arama motorlarina haber ver (Bing/DDG/Yandex/Naver).
      # IndexNow anahtari public'tir (tasarim geregi kokte yayinda) — sir degildir.
      - name: Ping IndexNow
        if: steps.commit.outputs.changed == '1'
        run: |
          sleep 90  # GitHub Pages deploy'unun yayilmasini bekle
          python - <<'PYEOF'
          import json, re, urllib.request
          xml = open("sitemap.xml").read()
          urls = re.findall(r"<loc>([^<]+)</loc>", xml)
          key = "5f4730a9d19d1c026544a8735c5d7bf2"
          body = json.dumps({"host": "newslearner.com", "key": key,
            "keyLocation": f"https://newslearner.com/{key}.txt", "urlList": urls}).encode()
          req = urllib.request.Request("https://api.indexnow.org/indexnow", data=body,
            headers={"Content-Type": "application/json; charset=utf-8"})
          print("IndexNow HTTP", urllib.request.urlopen(req).status, "-", len(urls), "URL bildirildi")
          PYEOF
