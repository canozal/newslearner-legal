<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Akıllı mağaza yönlendirmesi: reklam/paylaşım linki olarak
         newslearner.com/get kullanılır. iOS → App Store, Android → Play,
         masaüstü → ana sayfadaki indirme bölümü. Arama motorlarına kapalı
         (yönlendirme sayfası, içerik değil). -->
    <meta name="robots" content="noindex, nofollow">
    <title>Get NewsLearner</title>
    <style>
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
               background: #0f172a; color: #f8fafc; font-family: 'Inter', -apple-system, sans-serif; text-align: center; }
        a { color: #60a5fa; }
        .box { padding: 24px; }
        .spin { width: 28px; height: 28px; border: 3px solid rgba(255,255,255,0.2); border-top-color: #3b82f6;
                border-radius: 50%; margin: 0 auto 16px; animation: r 0.8s linear infinite; }
        @keyframes r { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="box">
        <div class="spin"></div>
        <p>Taking you to the store…</p>
        <noscript>
            <p><a href="https://apps.apple.com/app/id6757966210">App Store (iPhone/iPad)</a></p>
            <p><a href="https://play.google.com/store/apps/details?id=com.learn.languages.newslearner">Google Play (Android)</a></p>
        </noscript>
    </div>
    <script>
        (function () {
            var APP_STORE = "https://apps.apple.com/app/id6757966210";
            var PLAY_BASE = "https://play.google.com/store/apps/details?id=com.learn.languages.newslearner";

            var ua = navigator.userAgent || "";

            // Ölçüm: kaç kişi bu sayfaya geldi? (kurulumlarla aynı panelde görünsün)
            // sendBeacon engellemez — yönlendirme hiç gecikmez. Hata olursa sessiz geç.
            // Aynı ziyaretçiyi üç aşamada da takip edebilmek için tek kimlik:
            //   hit  = sayfa açıldı
            //   go   = yönlendirme çağrıldı (hedef adresle)
            //   left = tarayıcı sayfadan GERÇEKTEN ayrıldı (mağazaya gitti)
            // hit≈go ama left≈0 ise yönlendirme engelleniyor demektir (bizim sorunumuz);
            // üçü de eşitse sorun mağaza sayfasının dönüştürmemesindedir.
            var visitorId = "web-" + Math.random().toString(36).slice(2);
            var params0 = new URLSearchParams(location.search);
            var baseProps = {
                campaign: params0.get("c") || "direct",
                platform: /iPhone|iPad|iPod/i.test(ua) ? "ios"
                        : /Android/i.test(ua) ? "android" : "desktop",
                in_app_browser: /FBAN|FBAV|FB_IAB|FBIOS|Instagram/i.test(ua)
            };
            var beacon = function (name, extra) {
                try {
                    var props = { $current_url: location.href };
                    for (var k in baseProps) props[k] = baseProps[k];
                    for (var k2 in (extra || {})) props[k2] = extra[k2];
                    navigator.sendBeacon("https://us.i.posthog.com/i/v0/e/", JSON.stringify({
                        api_key: "phc_qsgAaRgbh3vr9CWWEvLTQBDDPxSKDmWw3Msdpcfmauge",
                        event: name, distinct_id: visitorId, properties: props
                    }));
                } catch (e) { /* ölçüm asla akışı bozmasın */ }
            };

            beacon("smartlink_hit");
            // Sayfadan ayrılma = mağazaya gidiş kanıtı (sendBeacon bu iş için tasarlandı)
            window.addEventListener("pagehide", function () { beacon("smartlink_left"); });
            document.addEventListener("visibilitychange", function () {
                if (document.hidden) beacon("smartlink_left");
            });
            // iPadOS 13+ kendini Mac gibi tanıtır — dokunmatik Mac = iPad.
            var isIOS = /iPhone|iPad|iPod/i.test(ua) ||
                        (/Macintosh/i.test(ua) && navigator.maxTouchPoints > 1);
            var isAndroid = /Android/i.test(ua);

            // Kampanya takibi: /get?c=fb-post gibi bir etiket verilirse Play'e
            // Install Referrer olarak taşınır (Console'da kaynak kırılımı görünür).
            var params = new URLSearchParams(location.search);
            var campaign = params.get("c") || "website_get";
            var PLAY_STORE = PLAY_BASE + "&referrer=" +
                encodeURIComponent("utm_source=" + campaign + "&utm_medium=smartlink");

            // MAĞAZA UYGULAMASINI DOĞRUDAN AÇ (19-20 Ağu 2026 dersi):
            // Facebook/Instagram reklamları uygulama-içi tarayıcıda açılıyor ve orada
            // https://apps.apple.com linki Universal Link olarak ÇALIŞMIYOR — App
            // Store'un web sayfası gömülü tarayıcıda açılıyor, kullanıcı bir kez daha
            // "App Store'da Aç" demek zorunda kalıyor. Her ek adım dönüşümü yarıya
            // indiriyor (84 reklam tıklaması → ~4 kurulum).
            // Çözüm: önce native şema (itms-apps:// / market://) denenir; şema
            // desteklenmiyorsa 700 ms sonra https adresine düşülür.
            // Native şema YALNIZCA uygulama-içi tarayıcıda kullanılır. Sebep:
            // normal Safari/Chrome zaten https mağaza linkini native uygulamayla
            // açıyor (Universal Link), oysa mağaza uygulaması bulunmayan bir
            // cihazda itms-apps:// "adres geçersiz" hata diyaloğu bastırıyor ve
            // o diyalog yedek yönlendirmeyi de bloke ediyor (20 Ağu 2026,
            // simülatörde yakalandı). Riski sadece gereken yere sınırlıyoruz.
            var inAppBrowser = /FBAN|FBAV|FB_IAB|FBIOS|Instagram|Line|Twitter/i.test(ua);

            // 20 Ağu 2026 — GERİ ALINDI: native şema gömülü tarayıcıda asılı
            // kalmaya sebep oluyordu. 3 saatte 91 tıklama → 0 kurulum ölçüldü
            // (önceki gün https ile 84 tıklama → ~4 kurulum). Şema denemesi
            // iframe ile yapılıyor: sayfayı ASLA terk etmiyor, https yönlendirmesi
            // her koşulda çalışıyor. İptal mantığı yok — mağaza açıldıysa arkada
            // yönlendirme yapılmış olması zararsız.
            var openStore = function (nativeUrl, webUrl) {
                if (inAppBrowser && nativeUrl) {
                    try {
                        var f = document.createElement("iframe");
                        f.style.display = "none";
                        f.src = nativeUrl;
                        document.body.appendChild(f);
                    } catch (e) { /* şema denemesi başarısızsa sorun değil */ }
                }
                // Her durumda ve koşulsuz: https mağaza adresi.
                setTimeout(function () {
                    beacon("smartlink_go", { target: webUrl });
                    location.replace(webUrl);
                }, inAppBrowser ? 400 : 0);
            };

            if (isIOS) {
                openStore("itms-apps://apps.apple.com/app/id6757966210", APP_STORE);
            } else if (isAndroid) {
                openStore("market://details?id=com.learn.languages.newslearner", PLAY_STORE);
            } else {
                // Masaüstü: ana sayfadaki indirme bölümü (iki mağaza rozeti)
                location.replace("/#get");
            }
        })();
    </script>
</body>
</html>
