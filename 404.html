:root{--navy:#0A0E2A;--panel:#161E45;--line:#26315f;--blue-deep:#3A5EDE;
  --orange:#F5A623;--cream:#F3F1E9;--peri:#A6AFD8}
*{box-sizing:border-box;margin:0}
body{background:var(--navy);color:var(--cream);min-height:100vh;
  display:flex;align-items:center;justify-content:center;padding:24px;
  font-family:'Jakarta',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  -webkit-font-smoothing:antialiased;text-align:center}
a{color:inherit;text-decoration:none}
.box{max-width:560px}
.brand{display:inline-flex;align-items:center;gap:11px;font-weight:800;font-size:1.1rem;
  letter-spacing:-.02em;margin-bottom:42px}
.brand img{width:36px;height:36px;border-radius:10px}
.code{font-weight:800;font-size:clamp(5rem,18vw,8.5rem);line-height:1;letter-spacing:-.04em;
  color:var(--cream)}
.code em{font-style:normal;color:var(--orange)}
h1{font-weight:800;font-size:clamp(1.3rem,4vw,1.7rem);letter-spacing:-.02em;margin-top:18px}
p{color:var(--peri);margin-top:12px;line-height:1.65}
.tag{display:inline-block;margin-top:26px;padding:7px 14px;border:1px solid var(--line);
  border-radius:999px;background:var(--panel);color:var(--peri);font-size:.82rem;font-weight:600;
  letter-spacing:.08em;text-transform:uppercase}
.actions{margin-top:34px;display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;font-weight:600;border-radius:999px;
  padding:13px 26px;font-size:.95rem;transition:transform .2s}
.btn:hover{transform:translateY(-2px)}
.btn-primary{background:var(--blue-deep);color:#fff;box-shadow:0 6px 22px rgba(58,94,222,.4)}
.btn-ghost{border:1px solid var(--line);background:var(--panel);color:var(--cream)}
</style>
</head>
